version: 2.1
parameters:
  publish_site:
    type: boolean
    default: true
jobs:
  build:
    docker:
      - image: cimg/node:22.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify canonical package and build website
          command: |
            python3 scripts/test_jusmanizer.py
            python3 scripts/validate-package.py
            python3 scripts/build-site.py
            python3 scripts/test_site.py
            node --check docs/assets/app.js
      - store_artifacts:
          path: .site-build
          destination: website
      - persist_to_workspace:
          root: .
          paths: [.site-build]
  publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/site-result
      - run:
          name: Publish the verified website to the Pages source branch
          command: python3 scripts/ci/publish-site.py /tmp/site-result/.site-build
workflows:
  website:
    jobs:
      - build
      - publish:
          requires: [build]
          serial-group: << pipeline.project.slug >>/jusmanizer-pages
          filters:
            branches:
              only: main
          pre-steps:
            - when:
                condition:
                  not: << pipeline.parameters.publish_site >>
                steps:
                  - run: circleci-agent step halt
